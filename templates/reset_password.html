{% extends "base.html" %}
{% block title %}Reset Password — Daily Memories{% endblock %}

{% block content %}
<div class="page-wrap">
    <div class="form-card">
        <span class="label">Account recovery</span>
        <h2 style="margin-top:6px;">Reset password</h2>
        <p class="form-sub">Enter your email and we'll send you a link to create a new password.</p>

        <form method="POST" action="{{ url_for('reset_password') }}">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
            </div>

            <button type="submit" class="btn btn-primary btn-full">Send reset link →</button>
        </form>

        <p class="form-footer">
            Remembered it? <a href="{{ url_for('login') }}">Back to login</a>
        </p>
    </div>
</div>
{% endblock %}
