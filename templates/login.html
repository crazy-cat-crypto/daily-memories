{% extends "base.html" %}
{% block title %}Login — Daily Memories{% endblock %}

{% block content %}
<div class="page-wrap">
    <div class="form-card">
        <span class="label">Welcome back</span>
        <h2 style="margin-top:6px;">Login</h2>
        <p class="form-sub">Access your private journal.</p>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <div style="text-align:right; margin-bottom:20px; margin-top:-8px;">
                <a href="{{ url_for('reset_password') }}" style="font-size:0.82rem; color:var(--ink-faint);">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-full">Login →</button>
        </form>

        <p class="form-footer">
            Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}
