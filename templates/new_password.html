{% extends "base.html" %}
{% block title %}New Password — Daily Memories{% endblock %}

{% block content %}
<div class="page-wrap">
    <div class="form-card">
        <span class="label">Almost done</span>
        <h2 style="margin-top:6px;">Set new password</h2>
        <p class="form-sub">Choose a strong password for your journal.</p>

        <form method="POST" action="{{ url_for('new_password', token=token) }}">
            <div class="form-group">
                <label for="password">New password</label>
                <input type="password" id="password" name="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm new password</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="••••••••" required autocomplete="new-password">
            </div>

            <button type="submit" class="btn btn-primary btn-full">Update password →</button>
        </form>
    </div>
</div>
{% endblock %}
